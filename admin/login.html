<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FUF Restaurant - Admin Login</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                FUF
            </div>

            <h1>
                لوحة الإدارة
            </h1>

            <p class="subtitle">
                تسجيل دخول المسؤول
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        اسم المستخدم
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="أدخل اسم المستخدم"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>

            </form>

        </div>

    </div>


    <script src="admin.js"></script>

</body>

</html>
