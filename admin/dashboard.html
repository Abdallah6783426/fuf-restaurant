<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FUF Restaurant - Dashboard</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <style>

        /* =================================================
           DASHBOARD
        ================================================= */

        body {
            display: block;
            min-height: 100vh;
            background: #141812;
        }


        /* =================================================
           HEADER
        ================================================= */

        .dashboard-header {

            background: #252b21;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);

            padding: 18px 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .dashboard-logo {

            font-size: 30px;

            font-weight: bold;

            letter-spacing: 7px;

            color: #c8b27c;

        }


        .admin-info {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        .admin-name {

            color: #ddd;

        }


        #logoutButton {

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.2s;

        }


        #logoutButton:hover {

            opacity: 0.85;

            transform: translateY(-1px);

        }


        /* =================================================
           MAIN
        ================================================= */

        .dashboard-container {

            width: 100%;

            max-width: 1400px;

            margin: auto;

            padding: 35px 25px;

        }


        .welcome-section {

            margin-bottom: 30px;

        }

            text-align: right;

        }

        }


        /* =================================================
           STATS
        ================================================= */

        .stats-grid {

            display: grid;

            grid-template-columns:

            gap: 20px;

            margin-bottom: 35px;

        }


        .stat-card {

            background: #252b21;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 15px;

            padding: 25px;

            transition: 0.2s;

        }


        .stat-card:hover {

            transform: translateY(-2px);

        }


        .stat-title {

            color: #aaa;

            font-size: 14px;

            margin-bottom: 12px;

        }


        .stat-number {

            color: #c8b27c;

        }


        /* =================================================
           SECTION
        ================================================= */

        .dashboard-section {

            background: #252b21;

        }


        .section-header {

            align-items: center;

            margin-bottom: 20px;

        }

        }


        .refresh-button {

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;

            transition: 0.2s;

        }


        .refresh-button:hover {

            opacity: 0.88;

            transform: translateY(-1px);

        }


        .refresh-button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;

        }


        /* =================================================
           ORDERS
        ================================================= */

        .orders-container {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        .order-card {

            background: #181c16;

                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 12px;

            padding: 20px;

            transition: 0.2s;

        }


        .order-card:hover {

            border-color:

        .order-top {

        }


        .order-date {

        }


        .order-status {

            padding: 7px 12px;

            border-radius: 20px;

            background: #444;

            font-size: 12px;

            font-weight: bold;

        }


        .status-pending {

            background: #725d27;

            color: #ffe9a3;

        }


        .status-confirmed {

            background: #285b48;

            color: #a8f0d1;

        }


        .status-preparing {

            background: #315b72;

        }

            background: #59447a;

        }

        ================================================= */

        .order-info {

            display: grid;

                repeat(3, 1fr);

            color: #fff;

        }


        /* =================================================
           ORDER ITEMS
        ================================================= */

                1px solid rgba(255, 255, 255, 0.08);

            margin-bottom: 15px;

        }


        .order-items-title {

            font-size: 13px;

            font-weight: bold;

        }


        .order-item {

            justify-content: space-between;

        }


        .order-item-name {

        }

        }

        .order-bottom {

        .order-total {

        .menu-card {

        }


        .menu-card:hover {

        }

        }

            color: #999;

            margin-bottom: 12px;

        }


        .menu-price {

            font-weight: bold;

        }


        .menu-category {

        .menu-image {

        .menu-edit-button:hover,

        }


        .menu-edit-button {

            background: #c8b27c;

        }


        .menu-delete-button {

            background: #8f3f3f;

        }


        /* =================================================
           ADD / EDIT MENU FORM
        ================================================= */

        .menu-form-box {

            background: #181c16;

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 12px;

        }


        .menu-form-buttons {

        }


        .menu-message.error {

        .empty-message {

            }

            .dashboard-header {

                padding: 15px;

            }

            }


            .menu-form-buttons {

                flex-direction: column;

                align-items: stretch;

            }


            .menu-submit-button,
            .menu-cancel-button {

                width: 100%;

            }

        }

    </style>

</head>

    <!-- =================================================
         DASHBOARD JAVASCRIPT
    ================================================= -->

    <script>


        /* =================================================
           API
        ================================================= */

        const API_URL =
            "http://localhost:3000";


        /* =================================================
           CHECK LOGIN
        ================================================= */

        const token =
            localStorage.getItem(
                "adminToken"
            );


        if (!token) {

            window.location.href =
                "login.html";

        }


        /* =================================================
           ADMIN DATA
        ================================================= */

        let adminData = {};

        try {

            adminData =
                JSON.parse(
                    localStorage.getItem(
                        "adminData"
                    ) || "{}"
                );

        } catch {

            adminData = {};

        }


        const adminName =
            document.getElementById(
                "adminName"
            );


        if (
            adminData &&
            adminData.username
        ) {

            adminName.textContent =
                `مرحباً ${adminData.username}`;

        }



        /* =================================================
           ELEMENTS
        ================================================= */

        const ordersContainer =
            document.getElementById(
                "ordersContainer"
            );


        const menuContainer =
            document.getElementById(
                "menuContainer"
            );


        const ordersCount =
            document.getElementById(
                "ordersCount"
            );


        const pendingCount =
            document.getElementById(
                "pendingCount"
            );


        const menuCount =
            document.getElementById(
                "menuCount"
            );


        const menuForm =
            document.getElementById(
                "menuForm"
            );


        const menuFormTitle =
            document.getElementById(
                "menuFormTitle"
            );


        const menuSubmitButton =
            document.getElementById(
                "menuSubmitButton"
            );


        const cancelEditButton =
            document.getElementById(
                "cancelEditButton"
            );


        const menuMessage =
            document.getElementById(
                "menuMessage"
            );


        const refreshOrdersButton =
            document.getElementById(
                "refreshOrders"
            );


        const refreshMenuButton =
            document.getElementById(
                "refreshMenu"
            );


        let editingMenuItemId = null;



        /* =================================================
           AUTH HEADERS
        ================================================= */

        function getAuthHeaders() {

            return {

                "Content-Type":
                    "application/json",

                "Authorization":
                    `Bearer ${token}`

            };

        }



        /* =================================================
           ESCAPE HTML
        ================================================= */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =================================================
           FORMAT DATE
        ================================================= */

        function formatDate(dateValue) {

            if (!dateValue) {

                return "غير معروف";

            }


            const date =
                new Date(dateValue);


            if (
                Number.isNaN(
                    date.getTime()
                )
            ) {

                return "غير معروف";

            }


            return date.toLocaleString(
                "ar-EG",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }



        /* =================================================
           STATUS TEXT
        ================================================= */

        function getStatusText(status) {

            const statuses = {

                pending:
                    "قيد الانتظار",

                confirmed:
                    "مؤكد",

                preparing:
                    "جاري التحضير",

                out_for_delivery:
                    "خرج للتوصيل",

                delivered:
                    "تم التوصيل",

                cancelled:
                    "ملغي"

            };


            return statuses[status] ||
                "غير معروف";

        }



        /* =================================================
           STATUS CLASS
        ================================================= */

        function getStatusClass(status) {

            const classes = {

                pending:
                    "status-pending",

                confirmed:
                    "status-confirmed",

                preparing:
                    "status-preparing",

                out_for_delivery:
                    "status-out-for-delivery",

                delivered:
                    "status-delivered",

                cancelled:
                    "status-cancelled"

            };


            return classes[status] ||
                "";

        }



        /* =================================================
           LOAD ORDERS
        ================================================= */

        async function loadOrders() {

            ordersContainer.innerHTML =
                `
                    <div class="loading">
                        جاري تحميل الطلبات...
                    </div>
                `;


            refreshOrdersButton.disabled =
                true;


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/orders`,
                        {

                            method:
                                "GET",

                            headers:
                                getAuthHeaders()

                        }
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;

                    }


                    throw new Error(
                        data?.message ||
                        "فشل تحميل الطلبات"
                    );

                }


                if (
                    !Array.isArray(data)
                ) {

                    throw new Error(
                        "بيانات الطلبات غير صحيحة"
                    );

                }


                ordersCount.textContent =
                    data.length;


                const pendingOrders =
                    data.filter(
                        order =>
                            order.status ===
                            "pending"
                    );


                pendingCount.textContent =
                    pendingOrders.length;


                renderOrders(data);


            } catch (error) {

                console.error(
                    "Load orders error:",
                    error
                );


                ordersContainer.innerHTML =
                    `
                        <div class="error-message">

                            ${escapeHTML(
                                error.message
                            )}

                        </div>
                    `;

            } finally {

                refreshOrdersButton.disabled =
                    false;

            }

        }



        /* =================================================
           RENDER ORDERS
        ================================================= */

        function renderOrders(orders) {

            if (
                !orders ||
                orders.length === 0
            ) {

                ordersContainer.innerHTML =
                    `
                        <div class="empty-message">

                            لا توجد طلبات حالياً

                        </div>
                    `;

                return;

            }


            ordersContainer.innerHTML =
                orders.map(
                    function (order) {


                        const orderItems =
                            Array.isArray(
                                order.items
                            )
                                ? order.items
                                : [];


                        const itemsHTML =
                            orderItems.length
                                ? orderItems.map(
                                    function (item) {

                                        const quantity =
                                            Number(
                                                item.quantity
                                            ) || 0;


                                        const price =
                                            Number(
                                                item.price
                                            ) || 0;


                                        const itemTotal =
                                            price *
                                            quantity;


                                        return `

                                            <div
                                                class="order-item"
                                            >

                                                <span
                                                    class="order-item-name"
                                                >

                                                    ${escapeHTML(
                                                        item.name
                                                    )}

                                                </span>


                                                <span
                                                    class="order-item-quantity"
                                                >

                                                    ${quantity}
                                                    ×
                                                    ${price}
                                                    جنيه

                                                </span>


                                                <span
                                                    class="order-item-price"
                                                >

                                                    ${itemTotal}
                                                    جنيه

                                                </span>

                                            </div>

                                        `;

                                    }
                                ).join("")
                                : `
                                    <div class="empty-message">
                                        لا توجد تفاصيل للطلب
                                    </div>
                                `;


                        const statusClass =
                            getStatusClass(
                                order.status
                            );


                        const orderId =
                            String(
                                order._id || ""
                            );


                        const shortOrderId =
                            orderId.length > 6
                                ? orderId.slice(-6)
                                : orderId;


                        return `

                            <div
                                class="order-card"
                            >


                                <div
                                    class="order-top"
                                >

                                    <div>

                                        <div
                                            class="order-id"
                                        >

                                            طلب #${escapeHTML(
                                                shortOrderId
                                            )}

                                        </div>


                                        <div
                                            class="order-date"
                                        >

                                            ${escapeHTML(
                                                formatDate(
                                                    order.createdAt
                                                )
                                            )}

                                        </div>

                                    </div>


                                    <div
                                        class="order-status ${statusClass}"
                                    >

                                        ${escapeHTML(
                                            getStatusText(
                                                order.status
                                            )
                                        )}

                                    </div>

                                </div>



                                <div
                                    class="order-info"
                                >

                                    <div>

                                        👤

                                        <strong>
                                            العميل:
                                        </strong>

                                        ${escapeHTML(
                                            order.customerName
                                        )}

                                    </div>


                                    <div>

                                        📞

                                        <strong>
                                            الهاتف:
                                        </strong>

                                        ${escapeHTML(
                                            order.phone
                                        )}

                                    </div>


                                    <div>

                                        📍

                                        <strong>
                                            العنوان:
                                        </strong>

                                        ${escapeHTML(
                                            order.address
                                        )}

                                    </div>

                                </div>



                                <div
                                    class="order-items"
                                >

                                    <div
                                        class="order-items-title"
                                    >

                                        تفاصيل الطلب

                                    </div>


                                    ${itemsHTML}

                                </div>



                                <div
                                    class="order-bottom"
                                >

                                    <div
                                        class="order-total"
                                    >

                                        الإجمالي:

                                        ${Number(
                                            order.total
                                        ) || 0}

                                        جنيه

                                    </div>


                                    <select
                                        class="status-select"
                                        data-order-id="${escapeHTML(
                                            orderId
                                        )}"
                                    >

                                        <option
                                            value="pending"
                                            ${order.status === "pending"
                                                ? "selected"
                                                : ""}
                                        >
                                            قيد الانتظار
                                        </option>


                                        <option
                                            value="confirmed"
                                            ${order.status === "confirmed"
                                                ? "selected"
                                                : ""}
                                        >
                                            مؤكد
                                        </option>


                                        <option
                                            value="preparing"
                                            ${order.status === "preparing"
                                                ? "selected"
                                                : ""}
                                        >
                                            جاري التحضير
                                        </option>


                                        <option
                                            value="out_for_delivery"
                                            ${order.status === "out_for_delivery"
                                                ? "selected"
                                                : ""}
                                        >
                                            خرج للتوصيل
                                        </option>


                                        <option
                                            value="delivered"
                                            ${order.status === "delivered"
                                                ? "selected"
                                                : ""}
                                        >
                                            تم التوصيل
                                        </option>


                                        <option
                                            value="cancelled"
                                            ${order.status === "cancelled"
                                                ? "selected"
                                                : ""}
                                        >
                                            ملغي
                                        </option>

                                    </select>

                                </div>


                            </div>

                        `;

                    }
                ).join("");


            /* =================================================
               STATUS EVENTS
            ================================================= */

            const statusSelects =
                ordersContainer.querySelectorAll(
                    ".status-select"
                );


            statusSelects.forEach(
                function (select) {

                    select.addEventListener(
                        "change",
                        function () {

                            changeOrderStatus(
                                this
                            );

                        }
                    );

                }
            );

        }



        /* =================================================
           CHANGE ORDER STATUS
        ================================================= */

        async function changeOrderStatus(
            selectElement
        ) {

            const orderId =
                selectElement.dataset.orderId;


            const status =
                selectElement.value;


            if (
                !orderId ||
                !status
            ) {

                return;

            }


            selectElement.disabled =
                true;


            const oldValue =
                selectElement.dataset.previousValue ||
                status;


            try {

                const response =
                    await fetch(

                        `${API_URL}/api/orders/${orderId}/status`,

                        {

                            method:
                                "PATCH",

                            headers:
                                getAuthHeaders(),

                            body:
                                JSON.stringify({
                                    status
                                })

                        }

                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;

                    }


                    throw new Error(
                        data?.message ||
                        "فشل تحديث حالة الطلب"
                    );

                }


                await loadOrders();


            } catch (error) {

                console.error(
                    "Change status error:",
                    error
                );


                alert(
                    error.message
                );


                selectElement.value =
                    oldValue;

                selectElement.disabled =
                    false;

            }

        }



        /* =================================================
           LOAD MENU
        ================================================= */

        async function loadMenu() {

            menuContainer.innerHTML =
                `
                    <div class="loading">
                        جاري تحميل المنيو...
                    </div>
                `;


            refreshMenuButton.disabled =
                true;


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/menu`
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    throw new Error(
                        data?.message ||
                        "فشل تحميل المنيو"
                    );

                }


                if (
                    !Array.isArray(data)
                ) {

                    throw new Error(
                        "بيانات المنيو غير صحيحة"
                    );

                }


                menuCount.textContent =
                    data.length;


                renderMenu(data);


            } catch (error) {

                console.error(
                    "Load menu error:",
                    error
                );


                menuContainer.innerHTML =
                    `
                        <div class="error-message">

                            ${escapeHTML(
                                error.message
                            )}

                        </div>
                    `;

            } finally {

                refreshMenuButton.disabled =
                    false;

            }

        }



        /* =================================================
           RENDER MENU
        ================================================= */

        function renderMenu(menuItems) {

            if (
                !menuItems ||
                menuItems.length === 0
            ) {

                menuContainer.innerHTML =
                    `
                        <div class="empty-message">

                            لا توجد أصناف في المنيو

                        </div>
                    `;

                return;

            }


            menuContainer.innerHTML =
                menuItems.map(
                    function (item) {

                        const safeImage =
                            escapeHTML(
                                item.image
                            );


                        const itemId =
                            escapeHTML(
                                item._id
                            );


                        return `

                            <div
                                class="menu-card"
                                data-menu-id="${itemId}"
                            >


                                <img
                                    class="menu-image"
                                    src="${safeImage}"
                                    alt="${escapeHTML(
                                        item.name
                                    )}"
                                    onerror="
                                        this.style.display='none';
                                    "
                                >


                                <h3>

                                    ${escapeHTML(
                                        item.name
                                    )}

                                </h3>


                                <p>

                                    ${escapeHTML(
                                        item.description
                                    )}

                                </p>


                                <div
                                    class="menu-price"
                                >

                                    ${Number(
                                        item.price
                                    ) || 0}

                                    جنيه

                                </div>


                                <div
                                    class="menu-category"
                                >

                                    التصنيف:

                                    ${escapeHTML(
                                        item.category
                                    )}

                                </div>


                                <div
                                    class="menu-actions"
                                >


                                    <button
                                        type="button"
                                        class="menu-edit-button"
                                        data-action="edit"
                                        data-id="${itemId}"
                                    >

                                        تعديل

                                    </button>


                                    <button
                                        type="button"
                                        class="menu-delete-button"
                                        data-action="delete"
                                        data-id="${itemId}"
                                    >

                                        حذف

                                    </button>


                                </div>


                            </div>

                        `;

                    }
                ).join("");


            /* =================================================
               MENU EVENTS
            ================================================= */

            const editButtons =
                menuContainer.querySelectorAll(
                    '[data-action="edit"]'
                );


            editButtons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            editMenuItem(
                                this.dataset.id
                            );

                        }
                    );

                }
            );


            const deleteButtons =
                menuContainer.querySelectorAll(
                    '[data-action="delete"]'
                );


            deleteButtons.forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            deleteMenuItem(
                                this.dataset.id
                            );

                        }
                    );

                }
            );

        }



        /* =================================================
           ADD / UPDATE MENU ITEM
        ================================================= */

        menuForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document
                        .getElementById(
                            "menuName"
                        )
                        .value
                        .trim();


                const description =
                    document
                        .getElementById(
                            "menuDescription"
                        )
                        .value
                        .trim();


                const price =
                    Number(
                        document
                            .getElementById(
                                "menuPrice"
                            )
                            .value
                    );


                const image =
                    document
                        .getElementById(
                            "menuImage"
                        )
                        .value
                        .trim();


                const category =
                    document
                        .getElementById(
                            "menuCategory"
                        )
                        .value
                        .trim();


                menuMessage.textContent =
                    "";

                menuMessage.className =
                    "menu-message";


                if (
                    !name ||
                    !description ||
                    !Number.isFinite(price) ||
                    price <= 0 ||
                    !image ||
                    !category
                ) {

                    menuMessage.textContent =
                        "من فضلك املأ جميع البيانات بشكل صحيح.";

                    menuMessage.className =
                        "menu-message error";

                    return;

                }


                menuSubmitButton.disabled =
                    true;


                menuSubmitButton.textContent =
                    editingMenuItemId
                        ? "جاري التعديل..."
                        : "جاري الإضافة...";


                try {

                    let response;


                    /* =================================================
                       UPDATE
                    ================================================= */

                    if (
                        editingMenuItemId
                    ) {

                        response =
                            await fetch(

                                `${API_URL}/api/menu/${editingMenuItemId}`,

                                {

                                    method:
                                        "PUT",

                                    headers:
                                        getAuthHeaders(),

                                    body:
                                        JSON.stringify({

                                            name,

                                            description,

                                            price,

                                            image,

                                            category

                                        })

                                }

                            );

                    }


                    /* =================================================
                       ADD
                    ================================================= */

                    else {

                        response =
                            await fetch(

                                `${API_URL}/api/menu`,

                                {

                                    method:
                                        "POST",

                                    headers:
                                        getAuthHeaders(),

                                    body:
                                        JSON.stringify({

                                            name,

                                            description,

                                            price,

                                            image,

                                            category

                                        })

                                }

                            );

                    }


                    let data = null;


                    try {

                        data =
                            await response.json();

                    } catch {

                        data = null;

                    }


                    if (!response.ok) {

                        if (
                            response.status === 401
                        ) {

                            logout();

                            return;

                        }


                        throw new Error(
                            data?.message ||
                            "حدث خطأ أثناء حفظ الصنف"
                        );

                    }


                    const wasEditing =
                        Boolean(
                            editingMenuItemId
                        );


                    resetMenuForm();


                    menuMessage.textContent =
                        wasEditing
                            ? "تم تعديل الصنف بنجاح ✅"
                            : "تم إضافة الصنف بنجاح ✅";


                    menuMessage.className =
                        "menu-message success";


                    await loadMenu();


                    setTimeout(
                        function () {

                            menuMessage.textContent =
                                "";

                        },
                        3000
                    );


                } catch (error) {

                    console.error(
                        "Save menu item error:",
                        error
                    );


                    menuMessage.textContent =
                        error.message ||
                        "حدث خطأ أثناء حفظ الصنف";


                    menuMessage.className =
                        "menu-message error";

                } finally {

                    menuSubmitButton.disabled =
                        false;


                    menuSubmitButton.textContent =
                        editingMenuItemId
                            ? "حفظ التعديل"
                            : "+ إضافة الصنف";

                }

            }
        );



        /* =================================================
           EDIT MENU ITEM
        ================================================= */

        async function editMenuItem(id) {

            if (!id) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/menu`
                    );


                let menuItems = null;


                try {

                    menuItems =
                        await response.json();

                } catch {

                    menuItems = null;

                }


                if (!response.ok) {

                    throw new Error(
                        "فشل تحميل بيانات الصنف"
                    );

                }


                const item =
                    Array.isArray(
                        menuItems
                    )
                        ? menuItems.find(
                            menuItem =>
                                menuItem._id === id
                        )
                        : null;


                if (!item) {

                    alert(
                        "الصنف غير موجود"
                    );

                    return;

                }


                editingMenuItemId =
                    id;


                document
                    .getElementById(
                        "menuName"
                    )
                    .value =
                    item.name || "";


                document
                    .getElementById(
                        "menuDescription"
                    )
                    .value =
                    item.description || "";


                document
                    .getElementById(
                        "menuPrice"
                    )
                    .value =
                    item.price || "";


                document
                    .getElementById(
                        "menuImage"
                    )
                    .value =
                    item.image || "";


                document
                    .getElementById(
                        "menuCategory"
                    )
                    .value =
                    item.category || "";


                menuFormTitle.textContent =
                    "تعديل الصنف";


                menuSubmitButton.textContent =
                    "حفظ التعديل";


                cancelEditButton.style.display =
                    "block";


                menuMessage.textContent =
                    "";


                menuForm.scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "center"

                });


            } catch (error) {

                console.error(
                    "Edit menu item error:",
                    error
                );


                alert(
                    error.message
                );

            }

        }



        /* =================================================
           DELETE MENU ITEM
        ================================================= */

        async function deleteMenuItem(id) {

            if (!id) {
                return;
            }


            const confirmed =
                confirm(
                    "هل أنت متأكد من حذف هذا الصنف؟\n\nلن تستطيع التراجع عن الحذف."
                );


            if (!confirmed) {

                return;

            }


            try {

                const response =
                    await fetch(

                        `${API_URL}/api/menu/${id}`,

                        {

                            method:
                                "DELETE",

                            headers:
                                getAuthHeaders()

                        }

                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    if (
                        response.status === 401
                    ) {

                        logout();

                        return;

                    }


                    throw new Error(
                        data?.message ||
                        "فشل حذف الصنف"
                    );

                }


                if (
                    editingMenuItemId === id
                ) {

                    resetMenuForm();

                }


                await loadMenu();


            } catch (error) {

                console.error(
                    "Delete menu item error:",
                    error
                );


                alert(
                    error.message
                );

            }

        }



        /* =================================================
           CANCEL EDIT
        ================================================= */

        cancelEditButton.addEventListener(
            "click",
            function () {

                resetMenuForm();

            }
        );



        /* =================================================
           RESET MENU FORM
        ================================================= */

        function resetMenuForm() {

            editingMenuItemId =
                null;


            menuForm.reset();


            menuFormTitle.textContent =
                "إضافة صنف جديد";


            menuSubmitButton.textContent =
                "+ إضافة الصنف";


            cancelEditButton.style.display =
                "none";


            menuMessage.textContent =
                "";

            menuMessage.className =
                "menu-message";

        }



        /* =================================================
           LOGOUT
        ================================================= */

        function logout() {

            localStorage.removeItem(
                "adminToken"
            );


            localStorage.removeItem(
                "adminData"
            );


            window.location.href =
                "login.html";

        }



        /* =================================================
           BUTTONS
        ================================================= */

        document
            .getElementById(
                "logoutButton"
            )
            .addEventListener(
                "click",
                logout
            );


        refreshOrdersButton
            .addEventListener(
                "click",
                loadOrders
            );


        refreshMenuButton
            .addEventListener(
                "click",
                loadMenu
            );



        /* =================================================
           INITIAL LOAD
        ================================================= */

        loadOrders();

        loadMenu();

    </script>

</body>

</html>
